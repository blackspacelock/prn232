name: secompass
description: "SECompass mobile client — Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # HTTP / REST
  dio: ^5.4.3+1
  retrofit: ^4.1.0

  # GraphQL reads
  graphql_flutter: ^5.1.2

  # Local storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # UI / animation
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Charts
  fl_chart: ^0.68.0

  # Chat
  dash_chat_2: ^0.0.21

  # Markdown
  flutter_markdown: ^0.7.4+1

  # Misc
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  freezed_annotation: ^2.4.4
  google_sign_in: ^6.2.1
  envied: ^0.5.0
  json_annotation: ^4.9.0
  intl: ^0.19.0
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  firebase_core: ^3.4.0
  firebase_analytics: ^11.3.0
  firebase_crashlytics: ^4.1.0
  firebase_remote_config: ^5.1.0
  firebase_messaging: ^15.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
